<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanzas App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-container">
    <section class="login-card">
      <div class="logo">💰</div>
      <h1>Finanzas App</h1>
      <p class="subtitle">Organiza tus finanzas de forma sencilla.</p>

      <button id="google-login" class="login-button google-button">
        <span class="google-icon">G</span>
        <span>Continuar con Google</span>
      </button>

      <button id="apple-login" class="login-button apple-button" type="button">
        <span></span>
        <span>Continuar con Apple</span>
      </button>

      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
